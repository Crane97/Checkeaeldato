[project]
name = "checkea-el-dato"
version = "0.1.0"
description = "Verificador de afirmaciones en discursos y debates políticos en español"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "fastapi>=0.143.0",
    "httpx",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pypdf>=6.1",
    "pyyaml>=6",
    "tenacity",
    "typer",
    "uvicorn>=0.54.0",
]

[project.scripts]
verificar = "pipeline.cli:app"
verificar-web = "pipeline.web.app:main"
conocimiento = "pipeline.knowledge.cli:app"
auditar = "pipeline.audit:app"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pytest",
    "pytest-cov>=7.1.0",
    "rapidfuzz>=3.14.6",
    "respx",
    "ruff",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Markdown (CLAUDE.md, prompts/) is documentation, not code to format.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "supabase: integration test against the DEVELOPMENT Supabase Postgres (inside a rolled-back transaction)",
]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]
