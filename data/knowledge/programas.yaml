# Programas electorales de las elecciones generales (ref.programs, migración 0010).
#
# QUIÉN ENTRA (decisión del responsable, 2026-10-20), la misma regla en todas las
# elecciones: las candidaturas cuyos diputados formaron GRUPO PARLAMENTARIO PROPIO en el
# Congreso en la legislatura siguiente. No cuentan el Grupo Mixto ni los grupos de varias
# formaciones creados para dividirlo (Plural, XIV legislatura). Un grupo formado con
# diputados prestados por otros grupos cuenta igual (Junts y ERC, XV): el criterio es
# institucional, no se valora cómo se formó.
#
# Los grupos de cada legislatura salen de fuentes secundarias (prensa y Wikipedia) y están
# PENDIENTES de contrastar con el BOCG (serie D) de cada legislatura: agente data-verifier
# antes de aprobar ningún programa.
#
# URL: solo del dominio oficial del partido (`dominios`), en vivo o en su copia de
# archive.org. Nunca copias de medios o agregadores. Para proponer candidatos:
#     uv run python scripts/recopilar_programas.py --buscar
# y se fija aquí la elegida (`url`). `url: null` = aún sin localizar; no se carga.
#
# Pendiente de decidir (anotado, no incluido): programas propios de las candidaturas
# confederadas dentro de un grupo (En Comú Podem, En Marea…, en el grupo de Unidas
# Podemos) y de las federaciones territoriales (PSC dentro del PSOE).

