# Semilla de la base de políticos: QUIÉN entra, elegido por el cargo que ocupa (nunca por el
# partido). Criterio decidido el 2026-10-14:
#   - Gobierno de España (La Moncloa, BOE)
#   - miembros del Gobierno que han salido durante la legislatura
#   - expresidentes del Gobierno vivos
#   - presidencias autonómicas y de Ceuta y Melilla (BOE)
#   - presidencias del Congreso y del Senado
#   - portavoces de los grupos parlamentarios del Congreso en la XV Legislatura (disuelta el
#     06-10-2026: ya no es un cargo actual)
#   - dirección nacional de los partidos con representación
#   - alcaldías de las cinco ciudades más pobladas
# Sin confirmar en una fuente fiable (no incluidos todavía): liderazgo de Sumar, UPN, portavoz
# del Grupo Mixto.
#
# nombre: el oficial completo, como en el BOE (el recopilador busca así los nombramientos).
# cargos_actuales:
#   boe: true  → se comprueba que el último nombramiento para ese cargo es de esta persona.
#   fuente     → página oficial donde se constata hoy (el recopilador avisa si el nombre no
#                aparece en ella; es un indicio, la revisión humana decide).
# Regenerar: uv run python scripts/recopilar_politicos.py

