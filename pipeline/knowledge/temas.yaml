# Temas de las afirmaciones, para medir la cobertura de la base de conocimiento por partido
# y tema (`uv run conocimiento cobertura`). Una afirmación con indicador toma el tema de
# su indicador en el catálogo; si no tiene, el tema con MÁS palabras clave en el texto
# normalizado (sin tildes, palabras o expresiones completas; empate: el primero de la
# lista). Si ninguna aparece: "otros".
#
# Palabras descriptivas, con términos jurídicos o técnicos y no de encuadre (revisado por
# neutrality-auditor, 2026-10-14). Incluye los temas que usa cada partido, para que ninguno
# quede en "otros" por falta de lista. Editable: afecta a los veredictos que se guarden
# después. Los temas del catálogo de indicadores (catalog.yaml) deben estar aquí.

fiscalidad: [impuesto, impuestos, iva, irpf, impuesto de sociedades, recaudacion, tributos,
             politica fiscal, presion fiscal, deducciones, amnistia fiscal, regularizacion fiscal]
